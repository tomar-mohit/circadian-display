# Detekt configuration for Circadian Display
# https://detekt.dev/docs/introduction/configurations

build:
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
    # Compose screens are declarative UI that legitimately exceed this metric.
    excludes: ['**/ui/**']
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    # Compose composables often carry many callbacks/modifiers.
    excludes: ['**/ui/**']
  ComplexCondition:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    excludes: ['**/ui/**']
  TooManyFunctions:
    active: false  # Disabled — ViewModels and Repositories naturally accumulate functions

empty-blocks:
  active: true

exceptions:
  active: true
  SwallowedException:
    active: false  # We handle exceptions deliberately in some paths

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|(`.*`)'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true

style:
  active: true
  ReturnCount:
    active: false  # Early returns are preferred for guard clauses
  WildcardImport:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  MagicNumber:
    active: false  # Disabled — domain values like 1439 (minutes in a day) are self-documenting
